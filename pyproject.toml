[project]
name = "mammosightr-case-benchmark"
version = "0.1.0"
description = "Case-level BI-RADS, density and quadrant benchmark on MammosightTR (official YARISMA test set)"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "gradio>=5",
    "pytest>=8",
]

[tool.uv]
package = false
